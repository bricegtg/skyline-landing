# Render Blueprint — defines build + headers for skylinedronesph.com
# Reference: https://render.com/docs/blueprint-spec
#
# After committing, link this Blueprint in the Render Dashboard:
#   New > Blueprint > select bricegtg/skyline-landing > main branch
# Existing dashboard rules NOT listed here are preserved.

services:
  - type: web
    name: skyline-landing
    runtime: static
    branch: main
    buildCommand: ""           # static repo — nothing to build
    staticPublishPath: .

    routes:
      - type: redirect
        source: /about.html
        destination: /
      - type: redirect
        source: /about
        destination: /

    headers:
      # Force HTTPS for a year and prepare for browser preload submission
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

      # Block this site from being framed (clickjacking defense)
      - path: /*
        name: X-Frame-Options
        value: DENY

      # Belt-and-braces MIME sniffing block (Render adds this too)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Limit referrer leakage on outbound clicks
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Deny camera/mic/geo/payment APIs entirely; allow only same-origin autoplay/fullscreen
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self), autoplay=(self)

      # Cross-origin isolation
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site

      # Content Security Policy
      # - 'unsafe-inline' on script-src is required because index.html ships inline <script> blocks and onclick handlers
      # - 'unsafe-inline' on style-src for inline style="" attributes
      # - https: on img-src to allow social embeds / contact form images
      # - formsubmit.co is the contact form endpoint (handleSubmit posts to formsubmit.co/ajax)
      # - googletagmanager.com / google-analytics.com for GTM + GA4
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://formsubmit.co https://www.google-analytics.com https://analytics.google.com https://*.google-analytics.com https://www.googletagmanager.com; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

      # Static media: cache 30 days at browser and edge (HTML keeps Render's default short TTL)
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.png
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=2592000

      # security.txt — make it discoverable and uncached
      - path: /.well-known/security.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /.well-known/security.txt
        name: Cache-Control
        value: public, max-age=86400
