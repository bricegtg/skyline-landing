# Render Blueprint — defines build + headers for skylinedronesph.com
# Reference: https://render.com/docs/blueprint-spec
#
# IMPORTANT: the live service is named "skyline-landing-site", not
# "skyline-landing". This file's service name below has been aligned to
# match so that linking this Blueprint (New > Blueprint > select
# bricegtg/skyline-landing > main branch) updates the existing live
# service instead of creating a duplicate one.
#
# If you don't want to link the Blueprint, you can instead paste the
# headers below directly into the live service's dashboard under
# skyline-landing-site > Settings > Redirects/Rewrites and Headers.
# See the PR description for the exact steps and header list.
# Existing dashboard rules NOT listed here are preserved.

services:
  - type: web
    name: skyline-landing-site
    runtime: static
    branch: main
    buildCommand: ""           # static repo — nothing to build
    staticPublishPath: .

    routes:
      - type: redirect
        source: /about.html
        destination: /
      - type: redirect
        source: /about
        destination: /
      # Blog disabled pending content review (June 20, 2026). The pages
      # under /blog/ already client-side redirect to / via meta-refresh,
      # so this is a defense-in-depth server-side redirect for any path
      # under /blog/ that isn't a real file.
      - type: redirect
        source: /blog
        destination: /
      - type: redirect
        source: /blog/*
        destination: /

    headers:
      # Force HTTPS for a year and prepare for browser preload submission
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload

      # Block this site from being framed (clickjacking defense)
      - path: /*
        name: X-Frame-Options
        value: DENY

      # Belt-and-braces MIME sniffing block (Render/Cloudflare add this too)
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Limit referrer leakage on outbound clicks
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

      # Deny camera/mic/geo/payment APIs entirely; allow only same-origin autoplay/fullscreen
      - path: /*
        name: Permissions-Policy
        value: geolocation=(), camera=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), fullscreen=(self), autoplay=(self)

      # Cross-origin isolation
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      - path: /*
        name: Cross-Origin-Resource-Policy
        value: same-site

      # Content Security Policy, tuned to what the site actually loads
      # (verified against every page's <script>/<link>/<img>/fetch() references):
      # - No third-party scripts, stylesheets, fonts or analytics are loaded live,
      #   so script-src/style-src/font-src only need 'self' (+ 'unsafe-inline'
      #   below) and there is no googletagmanager.com/google-analytics.com to allow.
      # - 'unsafe-inline' on script-src is required because the pages ship inline
      #   <script> blocks and onclick/onsubmit/onerror handlers.
      # - 'unsafe-inline' on style-src is required for inline style="" attributes.
      # - img-src is 'self' + data:/blob: only; no external image hosts are used.
      # - formsubmit.co is the contact form's fetch() endpoint and form fallback.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://formsubmit.co; form-action 'self' https://formsubmit.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

      # Static media: cache 30 days at browser and edge (HTML keeps Render's default short TTL)
      - path: /*.jpg
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.png
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.webp
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.mp4
        name: Cache-Control
        value: public, max-age=2592000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=2592000

      # security.txt — make it discoverable and uncached
      - path: /.well-known/security.txt
        name: Content-Type
        value: text/plain; charset=utf-8
      - path: /.well-known/security.txt
        name: Cache-Control
        value: public, max-age=86400
